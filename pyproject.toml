[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phase0"
version = "0.1.0"
description = "An idiomatic python project"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
data-cli = "phase0.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/phase0"]